# Nombre de la aplicación configurado para Spring Boot.
spring.application.name=umbral-backend

# Configurar estas variables en el entorno del proceso o en IntelliJ Run/Debug.
# No se incluyen credenciales ni se presupone un nombre de base de datos.
spring.datasource.url=${UMBRAL_DB_URL}
spring.datasource.username=${UMBRAL_DB_USERNAME}
spring.datasource.password=${UMBRAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway administra el esquema; Hibernate solo comprueba su compatibilidad.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
