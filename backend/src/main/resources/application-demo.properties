# Solo demostracion local; no requiere variables ni servidor PostgreSQL.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:mem:umbral-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# V0-V2 ya se verifican en H2 mediante la suite de integracion.
# Los datos ficticios solo se descubren al activar este perfil.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/demo,classpath:db/identity-demo
umbral.resumen.enabled=true
